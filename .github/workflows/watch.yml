name: Cyber Watch AI
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch.py
      - name: Persist dashboard and alert history
        run: |
          git config user.name 'Cyber Watch Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/index.html state.db
          git commit -m 'Update Cyber Watch intelligence' || true
          git push
